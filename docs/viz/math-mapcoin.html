<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLE và MAP · Mô phỏng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="viz.css?v=20261114b">
<style>
  .sl { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; max-width: 620px; margin: 8px auto; }
  .sl input { width: 100%; }
  .coins { font-family: ui-monospace, monospace; font-size: .85rem; color: var(--muted); max-width: 620px; margin: 6px auto; word-break: break-all; min-height: 1.3em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="no-embed">
    <div class="top">
      <h1>Tung đồng xu: MLE và MAP</h1>
      <div class="crumbs"><a href="../#/math/ch04_vi">← Chương 4 Ước lượng tham số mô hình</a></div>
    </div>
    <p class="lead">Một đồng xu có xác suất ngửa $\lambda$ mà ta không biết. Tung nó vài lần rồi ước lượng $\lambda$. MLE chỉ dùng dữ liệu; MAP dùng thêm tiên nghiệm $\text{Beta}(\alpha, \beta)$.</p>
  </div>
  <div class="only-embed open-full"><a href="math-mapcoin.html" target="_blank" rel="noopener">Mở trang riêng ↗</a></div>

  <div class="blk">
    <div class="sl">
      <label for="lt">$\lambda$ thật</label><input id="lt" type="range" min="0.02" max="0.98" step="0.01" value="0.3"><span class="val" id="lt-v"></span>
      <label for="a">$\alpha$</label><input id="a" type="range" min="1" max="30" step="0.5" value="5"><span class="val" id="a-v"></span>
      <label for="b">$\beta$</label><input id="b" type="range" min="1" max="30" step="0.5" value="5"><span class="val" id="b-v"></span>
    </div>
    <div class="ctrl">
      <button type="button" class="btn pri" id="t1">Tung 1 lần</button>
      <button type="button" class="btn" id="t10">Tung 10 lần</button>
      <button type="button" class="btn" id="t100">Tung 100 lần</button>
      <button type="button" class="btn" id="reset">Làm lại</button>
    </div>
    <div class="coins" id="coins"></div>
    <div class="plotbox"><svg id="sv" viewBox="0 0 600 300" role="img" aria-label="Tiên nghiệm, hàm hợp lý và hậu nghiệm"></svg></div>
    <table class="mtab" id="tab"></table>
    <div class="plotbox"><svg id="ch" viewBox="0 0 600 200" role="img" aria-label="Ước lượng theo số lần tung"></svg></div>
    <div class="insight" id="insight"></div>
  </div>
</div>
<script src="viz.js"></script>
<script src="ml-common.js"></script>
<script>
(function () {
  'use strict';
  var V_ = Viz, CP = '#9aa0c8', CL = '#2f80f5', CQ = '#e8487f', CT = '#0ea5a4';
  var rnd = MLV.rng(2024), flips = [];
  function lgamma(z) {           // Lanczos
    var g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
    z -= 1; var x = c[0]; for (var i = 1; i < g + 2; i++) x += c[i] / (z + i);
    var t = z + g + 0.5; return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
  }
  function betaPdf(x, a, b) { if (x <= 0 || x >= 1) return (x <= 0 && a === 1) || (x >= 1 && b === 1) ? Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b)) : 0; return Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + (a - 1) * Math.log(x) + (b - 1) * Math.log(1 - x)); }
  function par() { return { lt: +V_.$('#lt').value, a: +V_.$('#a').value, b: +V_.$('#b').value }; }
  function toss(k) { var lt = par().lt; for (var i = 0; i < k; i++) flips.push(rnd() < lt ? 1 : 0); render(); }

  function render() {
    var q = par(), a = q.a, b = q.b, N = flips.length, n = flips.reduce(function (s, v) { return s + v; }, 0), m = N - n;
    V_.$('#lt-v').textContent = V_.fmt(q.lt, 2); V_.$('#a-v').textContent = V_.fmt(a, 1); V_.$('#b-v').textContent = V_.fmt(b, 1);
    var tail = flips.slice(-120).map(function (f) { return f ? 'N' : 's'; }).join('');
    V_.$('#coins').textContent = N ? (N > 120 ? '… ' : '') + tail + '   (N = ngửa, s = sấp)' : 'Chưa tung lần nào.';
    var mle = N ? n / N : NaN, map = (n + a - 1) / (N + a + b - 2);
    if (a + b + N <= 2) map = NaN;
    var pa = n + a, pb = m + b, pmean = pa / (pa + pb), psd = Math.sqrt(pa * pb / ((pa + pb) * (pa + pb) * (pa + pb + 1)));

    // đồ thị 1: các đường cong trên [0, 1], mỗi đường chuẩn hoá về đỉnh 1 để dễ so sánh hình dạng
    var svg = V_.$('#sv'), P = MLV.Plot(svg, { W: 600, H: 300, x: [0, 1], y: [0, 1.08], m: { l: 40, r: 14, t: 10, b: 36 }, xlabel: 'λ', ylabel: 'mật độ (chuẩn hoá về đỉnh 1)' });
    P.axes();
    function curve(f, attrs) {
      var xs = [], mx = 0; for (var i = 1; i < 400; i++) { var x = i / 400, v = f(x); xs.push([x, v]); if (v > mx) mx = v; }
      return P.poly(xs.map(function (p) { return [p[0], mx > 0 ? p[1] / mx : 0]; }), attrs);
    }
    curve(function (x) { return betaPdf(x, a, b); }, { stroke: CP, 'stroke-width': 2.5, 'stroke-dasharray': '6 4' });
    if (N) curve(function (x) { return Math.exp(n * Math.log(x) + m * Math.log(1 - x) - (N ? (n ? n * Math.log(mle) : 0) + (m ? m * Math.log(1 - mle) : 0) : 0)); }, { stroke: CL, 'stroke-width': 2.5 });
    curve(function (x) { return betaPdf(x, pa, pb); }, { stroke: CQ, 'stroke-width': 3 });
    function vline(x, color, dash) { if (isFinite(x)) P.el('line', { x1: P.sx(x), x2: P.sx(x), y1: P.sy(0), y2: P.sy(1.08), stroke: color, 'stroke-width': 1.5, 'stroke-dasharray': dash }); }
    vline(q.lt, CT, '2 3'); vline(mle, CL, '5 4'); vline(map, CQ, '5 4');
    var lg = [['tiên nghiệm Beta(α, β)', CP], ['hàm hợp lý', CL], ['hậu nghiệm Beta(n+α, m+β)', CQ], ['λ thật', CT]];
    lg.forEach(function (l, i) { P.el('rect', { x: 400, y: 18 + i * 17, width: 14, height: 4, fill: l[1] }); P.el('text', { x: 420, y: 24 + i * 17, class: 'pl-tick' }).textContent = l[0]; });

    V_.$('#tab').innerHTML = '<tr><th>Số lần tung</th><th>Ngửa $n$</th><th>MLE $n/N$</th><th>MAP (4.40)</th><th>Hậu nghiệm: trung bình ± độ lệch chuẩn</th></tr>' +
      '<tr><td>' + N + '</td><td>' + n + '</td><td>' + (N ? V_.fmt(mle, 3) : '—') + '</td><td>' + (isFinite(map) ? V_.fmt(map, 3) : '—') + '</td><td>' + V_.fmt(pmean, 3) + ' ± ' + V_.fmt(psd, 3) + '</td></tr>';
    V_.texAll(V_.$('#tab'));

    // đồ thị 2: ước lượng theo số lần tung
    var s1 = [], s2 = [], cn = 0;
    flips.forEach(function (f, i) { cn += f; var t = i + 1; s1.push([t, cn / t]); s2.push([t, (cn + a - 1) / (t + a + b - 2)]); });
    MLV.chart(V_.$('#ch'), [{ pts: s1, color: CL }, { pts: s2, color: CQ }, { pts: N ? [[1, q.lt], [Math.max(N, 2), q.lt]] : [], color: CT, dash: '3 3' }],
      { x: [1, Math.max(N, 10)], y: [0, 1], xlabel: 'số lần tung', ylabel: 'ước lượng λ', m: { l: 52, r: 12, t: 8, b: 34 } });

    var msg;
    if (!N) msg = 'Chưa có dữ liệu: hậu nghiệm chính là tiên nghiệm, và MAP là đỉnh của tiên nghiệm. Bấm "Tung 1 lần".';
    else if (N < 10) msg = 'Ít dữ liệu: MLE nhảy mạnh (sau 1 lần tung nó bằng đúng 0 hoặc 1). MAP bị tiên nghiệm kéo về phía $\\frac{\\alpha - 1}{\\alpha + \\beta - 2}$ nên ổn định hơn. Đường hồng (hậu nghiệm) nằm giữa đường xám (tiên nghiệm) và đường xanh (hàm hợp lý).';
    else msg = 'Hàm hợp lý hẹp dần như $1/\\sqrt{N}$ và lấn át tiên nghiệm: MAP và MLE gần nhau dần, cùng tiến về $\\lambda$ thật. Thử tăng $\\alpha = \\beta$ lên 30 (tiên nghiệm rất tin rằng đồng xu cân đối) với $\\lambda$ thật lệch xa 0.5: cần nhiều lần tung hơn để dữ liệu thắng được tiên nghiệm.';
    var ins = V_.$('#insight'); ins.innerHTML = msg; V_.texAll(ins);
  }
  V_.$('#t1').addEventListener('click', function () { toss(1); });
  V_.$('#t10').addEventListener('click', function () { toss(10); });
  V_.$('#t100').addEventListener('click', function () { toss(100); });
  V_.$('#reset').addEventListener('click', function () { flips = []; render(); });
  V_.$('#lt').addEventListener('input', function () { flips = []; render(); });
  ['#a', '#b'].forEach(function (s) { V_.$(s).addEventListener('input', render); });
  V_.texAll(document.body);
  render();
})();
</script>
</body>
</html>
