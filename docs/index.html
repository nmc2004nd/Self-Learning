    // Mô phỏng nhúng (docs/viz/*.html) báo chiều cao qua postMessage để iframe tự giãn
    window.addEventListener('message', function (e) {

      document.querySelectorAll('iframe.viz-frame').forEach(function (f) {

  <!-- Chỉ mục tìm kiếm của docsify (toàn bộ nội dung site) đã vượt hạn mức ~5 triệu ký tự của
       localStorage: nén bằng lz-string khi lưu, giải nén khi đọc. Hỏng thì bỏ qua, không làm vỡ trang. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script>
    (function () {
      if (!window.LZString || !window.Storage) return;
      var P = Storage.prototype, set = P.setItem, get = P.getItem, TAG = '\u0001lz:';
      function packed(k) { return typeof k === 'string' && k.indexOf('docsify.search.index') === 0; }
      P.setItem = function (k, v) {
        if (packed(k) && typeof v === 'string') v = TAG + LZString.compressToUTF16(v);
        try { return set.call(this, k, v); } catch (e) {
          if (!packed(k)) throw e;  // chỉ nuốt lỗi của chỉ mục: lần sau dựng lại là được
        }
      };
      P.getItem = function (k) {
        var v = get.call(this, k);
        if (packed(k) && v && v.indexOf(TAG) === 0) {
          try { v = LZString.decompressFromUTF16(v.slice(TAG.length)); } catch (e) { v = null; }
        }
        return v;
      };
    })();
  </script>
